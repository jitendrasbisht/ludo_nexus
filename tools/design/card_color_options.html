<title>Card color -- all options together</title>
<style>
  :root { --ink: #2b241a; --ink-soft: #6b6255; --page-bg: #f6f3ed; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f1ece0; --ink-soft: #b8ad98; --page-bg: #1b1812; } }
  :root[data-theme="dark"] { --ink: #f1ece0; --ink-soft: #b8ad98; --page-bg: #1b1812; }
  :root[data-theme="light"] { --ink: #2b241a; --ink-soft: #6b6255; --page-bg: #f6f3ed; }

  * { box-sizing: border-box; }

  p.sub { text-align: center; color: var(--ink-soft); font-size: 13.5px; margin: 0 0 2rem; max-width: 560px; margin-left: auto; margin-right: auto; line-height: 1.5; }

  .gallery { display: flex; flex-wrap: wrap; gap: 1.75rem; justify-content: center; align-items: flex-start; }

  figcaption { font-size: 12px; text-align: center; max-width: 190px; line-height: 1.4; }
  figcaption b { display: block; font-size: 13px; margin-bottom: 1px; color: var(--ink); }
  figcaption span { color: var(--ink-soft); }

  .topbar { height: 34px; flex-shrink: 0; display: flex; align-items: center; padding: 0 10px; }
  .topbar .title { font-weight: 700; font-size: 13px; color: #1a1a1a; }
  .cards { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 0; }
  .card { border-radius: 9px; padding: 7px 9px; display: flex; align-items: center; gap: 7px; box-shadow: 0 2px 5px rgba(20,50,100,0.15); border: 1px solid rgba(255,255,255,0.5); }
  .avatar { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; }

  .avatar.g { background: radial-gradient(circle at 35% 30%, #7be08a, #1a9c3d 60%, #0d6b26); }
  .avatar.y { background: radial-gradient(circle at 35% 30%, #fff59e, #e0c400 60%, #a89000); }
  .avatar.b { background: radial-gradient(circle at 35% 30%, #7ecbff, #1279d6 60%, #0a5aa8); }
