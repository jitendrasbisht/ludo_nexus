name: ludo_app
description: "A local Ludo game with AI bots, built for Play Store publishing."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/
    - assets/background/
    - assets/sounds/
    - assets/finish_cards/
